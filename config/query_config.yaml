project: 
  name: chemical_genomics_explorer
  phase: census_ingestion

paths: 
  processed_data: data/processed
  logs: logs
  results: results

census: 
  census_version: "2025-11-08"
  organism: Homo sapiens
  organism_key: homo_sapiens
  measurement_name: RNA
  tissue_general: liver
  disease: normal
  assay: "10x 3' v3"
  max_cells: 5000

qc:
  min_genes_per_cell: 200
  max_mito_percent: 10.0
  normalize_target_sum: 10000

manifold:
  n_top_genes: 2000
  n_pcs: 20
  n_neighbors: 15
  leiden_resolution: 0.8
  random_state: 42

pathway:
  marker_file: data/processed/cluster_markers.csv
  output_file: data/processed/pathway_enrichment.csv
  gene_column: names
  cluster_column: group
  adjusted_pvalue_cutoff: 0.01
  top_genes_per_cluster: 50
  enrichr_library: KEGG_2021_Human