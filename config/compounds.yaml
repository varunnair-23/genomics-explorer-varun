# Compounds present in sci-Plex2 (A549 lung adenocarcinoma).
# perturbation_label must match the 'perturbation' column in the single-cell data.
compounds:
  - name: Nutlin-3A
    perturbation_label: Nutlin
    class: MDM2-p53 inhibitor
    target: MDM2
    pathway: p53 signaling
    smiles: "CC(C)OC1=C(C=CC(=C1)OC)C2=N[C@H]([C@H](N2C(=O)N3CCNC(=O)C3)C4=CC=C(C=C4)Cl)C5=CC=C(C=C5)Cl"
    expected_formula: C30H30Cl2N4O4
    expected_mw: 581.5
    pubchem_cid: 11433190
    marker_genes: [CDKN1A, MDM2, BAX, BBC3, TP53I3, GADD45A, GDF15]

  - name: Vorinostat
    perturbation_label: SAHA
    class: HDAC inhibitor
    target: HDAC1/2/3/8
    pathway: epigenetic regulation / cell cycle
    smiles: "C1=CC=C(C=C1)NC(=O)CCCCCCC(=O)NO"
    expected_formula: C14H20N2O3
    expected_mw: 264.32
    pubchem_cid: 5311
    marker_genes: [CDKN1A, CDKN1B, HIST1H1C, HIST1H2BK, HEXIM1]

  - name: BMS-345541
    perturbation_label: BMS
    class: IKK inhibitor
    target: IKBKE / IKK complex
    pathway: NF-kappa B signaling
    smiles: "CC1=CC2=C(C=C1)N=C(C3=NC=C(N23)C)NCCN"
